[custom]
; 基础设置
enable_rule_generator=true
overwrite_original_rules=true

; 订阅转换参数
emoji=true
udp=true
xudp=true
tfo=false
scv=false
fdn=false
sort=true
list=true

; ========== 节点分组 ==========
; 随机优选：匹配备注名含 "CF" 的节点（CF移动优选/CF官方优选等）
- group_name=🎲 随机优选
- type=url-test
- url=http://www.gstatic.com/generate_204
- interval=300
- tolerance=50
- filter=CF

; 家宽优选：其余所有节点（不含 CF 的都归这里）
- group_name=🕸️ 家宽优选
- type=url-test
- url=http://www.gstatic.com/generate_204
- interval=300
- tolerance=50
- filter=.*

; 自动选择：全部节点一起测速
- group_name=🚀 自动选择
- type=url-test
- url=http://www.gstatic.com/generate_204
- interval=300
- tolerance=50
- include=🎲 随机优选|🕸️ 家宽优选

; 手动切换
- group_name=🔀 手动切换
- type=select
- include=🚀 自动选择|🎲 随机优选|🕸️ 家宽优选

; ========== 分流规则 ==========
[rule]
DOMAIN-SUFFIX,local,DIRECT
DOMAIN-SUFFIX,localhost,DIRECT
IP-CIDR,127.0.0.0/8,DIRECT
IP-CIDR,172.16.0.0/12,DIRECT
IP-CIDR,192.168.0.0/16,DIRECT
IP-CIDR,10.0.0.0/8,DIRECT
GEOIP,CN,DIRECT
MATCH,🚀 自动选择
