[custom]
; 基础设置
enable_rule_generator=true
overwrite_original_rules=true

; 订阅转换参数
emoji=true
udp=true
xudp=true
tfo=false
scv=false
fdn=false
sort=true
list=true

; 节点分组规则
; 家宽优选 - 自动测速选最快
- group_name=🕸️ 家宽优选
- type=url-test
- url=http://www.gstatic.com/generate_204
- interval=300
- tolerance=50
- filter=家宽
- 家宽

; 随机优选 - 自动测速选最快
- group_name=🎲 随机优选
- type=url-test
- url=http://www.gstatic.com/generate_204
- interval=300
- tolerance=50
- filter=CF
- 随机

; 自动选择（全部节点测速）
- group_name=🚀 自动选择
- type=url-test
- url=http://www.gstatic.com/generate_204
- interval=300
- tolerance=50
- include=家宽优选|随机优选|其他

; 兜底节点（手动切换）
- group_name=🔀 手动切换
- type=select
- include=自动选择|家宽优选|随机优选

; 策略组引用
[proxy_group]
🕸️ 家宽优选,url-test,url-test,http://www.gstatic.com/generate_204,300
🎲 随机优选,url-test,http://www.gstatic.com/generate_204,300
🚀 自动选择,url-test,http://www.gstatic.com/generate_204,300
🔀 手动切换,select

; 分流规则
[custom_proxy_group]
🕸️ 家宽优选=`家宽
🎲 随机优选=`CF
🚀 自动选择=`((?!(家宽|CF)).)*$|家宽|CF
🔀 手动切换=`🚀 自动选择|🕸️ 家宽优选|🎲 随机优选

; 其他节点（不匹配家宽和CF的）
[filter]
其他=`((?!(家宽|CF)).)*$

; 规则
[rule]
DOMAIN-SUFFIX,local,DIRECT
DOMAIN-SUFFIX,localhost,DIRECT
IP-CIDR,127.0.0.0/8,DIRECT
IP-CIDR,172.16.0.0/12,DIRECT
IP-CIDR,192.168.0.0/16,DIRECT
IP-CIDR,10.0.0.0/8,DIRECT
GEOIP,CN,DIRECT
MATCH,🚀 自动选择
